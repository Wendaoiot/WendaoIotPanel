# panel.wendaoiot.com：web-admin + API 反代 + WS（/iot/ 旧入口 302 到 /login）
# wiki.wendaoiot.com：wiki 静态站（宿主只读挂载 /var/www/wiki）

# ---- 管理后台 + API ----
server {
    listen 80;
    server_name panel.wendaoiot.com _;

    root /var/www/admin;
    index index.html;

    # gzip 前端静态资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存（vite 产物带内容 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代（容器网内 wendao:8080）
    location /api/ {
        proxy_pass http://wendao:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 实时推送（必须先于 /api/ 精确匹配；nginx 最长前缀优先，这里其实自动命中）
    location = /api/v1/ws {
        proxy_pass http://wendao:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # C 端 H5 已下线：旧入口统一跳管理后台登录
    location /iot/ {
        return 302 /login;
    }

    # 根路径 302 到登录页
    location = / {
        return 302 /login;
    }

    # SPA 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- wiki 静态站 ----
server {
    listen 80;
    server_name wiki.wendaoiot.com;

    root /var/www/wiki;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
